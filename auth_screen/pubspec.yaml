name: auth_screen
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  animated_text_kit: ^4.2.1
  fl_chart: ^0.71.0
  email_validator: ^3.0.0
  permission_handler: ^12.0.0+1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  intl: ^0.18.1

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  http: ^1.2.1
  image_picker: ^1.1.2
  firebase_storage: ^12.4.5
  logger: ^2.3.0
  provider: ^6.1.2

  # Instead of platform constraints, just include required packages
  file_selector_linux: ^0.9.2+1
  file_selector_macos: ^0.9.3+3
  file_selector_windows: ^0.9.3+1
  permission_handler_windows: ^0.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# Keep this section to override the dependency version
dependency_overrides:
  win32: 5.0.0 # Use an older, compatible version for iOS build
  url_launcher_ios: 6.1.5
  typed_data: ^1.3.2

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/MSIM1024_1024.png"
  remove_alpha_ios: true

flutter:
  assets:
    - assets/images/sim.jpg
    - assets/images/Growing Stock Index.gif
    - assets/images/blopblop2.png
    - assets/images/fin.jpg
    - assets/images/webpimage.webp
    - assets/images/placeholder.jpg
    - assets/images/dollaros.webp
    - assets/images/mario.gif
    - assets/images/wood.jpg
    - assets/icon/MSIM1024_1024.png
    - assets/images/3.png
    - assets/images/2.png
    - assets/images/1.png
    - assets/images/stage.jpg
    - assets/images/bground.jpg

  uses-material-design: true

  # Remove the fonts section as we're using Google Fonts instead
  # fonts:
  #   - family: Montserrat
  #     fonts:
  #       - asset: assets/fonts/Montserrat-Regular.ttf
  #       - asset: assets/fonts/Montserrat-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Montserrat-Medium.ttf
  #         weight: 500
